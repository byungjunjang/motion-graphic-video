<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>스타터 · 가상 앱 소개 모션그래픽</title>
<!--
  새 영상의 뼈대다. 글꼴 선언, #stage, 도우미 함수(rise·pop·slam), seek 의 구조를 가져와 장면만 새로 쓴다.
  소개 대상 "데이북" 은 가상의 앱이다. 숫자·문구는 모두 예시다.
  규칙은 .claude/skills/motion-video/references/seek-pattern.md 에 있다.
-->
<style>
@font-face{font-family:"Pretendard";font-weight:400;src:url("../assets/fonts/Pretendard-Regular.woff2") format("woff2");}
@font-face{font-family:"Pretendard";font-weight:600;src:url("../assets/fonts/Pretendard-SemiBold.woff2") format("woff2");}
:root{--bg:#EEF0F3;--ink:#12151B;--gray:#6B7280;--accent:#FF5A36;--dark:#0C0F14;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#000;}
body{font-family:"Pretendard",sans-serif;font-weight:400;color:var(--ink);-webkit-font-smoothing:antialiased;}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);}
#stage *{position:absolute;}
.b{font-weight:600;}
.num{font-weight:600;font-feature-settings:"tnum";letter-spacing:-0.03em;}
.fine{left:140px;top:985px;font-size:24px;color:var(--gray);letter-spacing:-0.01em;white-space:nowrap;}
.label{font-size:30px;font-weight:600;color:var(--accent);white-space:nowrap;}
.scene{left:0;top:0;width:1920px;height:1080px;}
span.i{position:static !important;}

/* 배경 격자 */
#grid{left:-120px;top:-120px;width:2160px;height:1320px;
  background-image:linear-gradient(rgba(18,21,27,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(18,21,27,.055) 1px,transparent 1px);
  background-size:120px 120px;}

/* 장면 1 · 제목 */
#s1label{left:140px;top:380px;}
#s1title{left:134px;top:430px;font-size:120px;letter-spacing:-0.03em;white-space:nowrap;}
#s1dot{left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--accent);}

/* 장면 2 · 숫자 */
#s2label{left:140px;top:176px;}
#s2title{left:140px;top:222px;font-size:64px;letter-spacing:-0.02em;white-space:nowrap;}
#s2num{left:126px;top:380px;font-size:330px;line-height:330px;white-space:nowrap;}
#s2num .unit{font-size:140px;color:var(--accent);margin-left:12px;}
#s2track{left:140px;top:800px;width:1100px;height:10px;border-radius:5px;background:rgba(18,21,27,.10);}
#s2bar{left:140px;top:800px;width:1100px;height:10px;border-radius:5px;background:var(--accent);transform-origin:0 50%;}

/* 장면 3 · 타일 */
#s3label{left:140px;top:112px;}
#s3title{left:140px;top:158px;font-size:72px;letter-spacing:-0.02em;white-space:nowrap;}
.tile{width:380px;height:300px;border-radius:24px;background:#fff;box-shadow:0 8px 30px rgba(20,30,60,.08);}
.tile .cat{left:32px;top:30px;font-size:32px;white-space:nowrap;}
.tile .det{left:32px;top:236px;font-size:24px;color:var(--gray);white-space:nowrap;}
.tile .td{right:30px;top:38px;width:16px;height:16px;border-radius:50%;background:var(--accent);}

/* 장면 4 · 큰 글자 */
#dark{left:0;top:0;width:1920px;height:1080px;background:var(--dark);color:#fff;}
.slam{left:140px;font-size:210px;line-height:210px;letter-spacing:-0.04em;white-space:nowrap;transform-origin:0 50%;}
#s4a{top:250px}#s4b{top:500px;color:var(--accent);}

/* 장면 5 · 끝 화면 */
#s5title{left:140px;top:400px;font-size:110px;letter-spacing:-0.03em;white-space:nowrap;}
#s5sub{left:144px;top:550px;font-size:48px;color:var(--gray);white-space:nowrap;}
#s5pill{left:144px;top:660px;height:72px;border-radius:36px;background:var(--ink);color:#fff;padding:0 34px;font-size:32px;line-height:72px;white-space:nowrap;}
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>

  <div class="scene" id="sc1">
    <div class="label" id="s1label">가상 앱 예시</div>
    <div class="b" id="s1title">하루를 한 줄로, 데이북</div>
    <div id="s1dot"></div>
  </div>

  <div class="scene" id="sc2">
    <div class="label" id="s2label">기록 습관</div>
    <div class="b" id="s2title">매일 쓰면 쌓이는 날</div>
    <div class="num" id="s2num"><span class="i" id="s2n">0</span><span class="i unit">일</span></div>
    <div id="s2track"></div><div id="s2bar"></div>
    <div class="fine" id="s2fine">예시 숫자 · 실제 영상에는 원문에서 확인한 숫자만 쓴다</div>
  </div>

  <div class="scene" id="sc3">
    <div class="label" id="s3label">기능</div>
    <div class="b" id="s3title">필요한 것만 세 가지</div>
    <div id="tiles"></div>
  </div>

  <div id="dark">
    <div class="slam b" id="s4a">복잡한 설정,</div>
    <div class="slam b" id="s4b">없음.</div>
  </div>

  <div class="scene" id="sc5">
    <div class="b" id="s5title">데이북</div>
    <div id="s5sub">오늘의 한 줄부터</div>
    <div class="b" id="s5pill">가상의 앱입니다</div>
  </div>
</div>

<script>
const DUR = 14;
const $ = id => document.getElementById(id);
const cl = x => Math.max(0, Math.min(1, x));
const pr = (t, a, d) => cl((t - a) / d);
const lerp = (a, b, p) => a + (b - a) * p;
const eo = x => 1 - Math.pow(1 - x, 4);
const ei = x => x * x * x;
const eio = x => x < .5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2;
const back = x => { const c1 = 1.1, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rise(el, t, a, d = 0.7, dist = 44) { const p = eo(pr(t, a, d)); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dist}px)`; }
function pop(el, t, a, d = 0.5, from = 0.9, dist = 50, rot = 0) { const p = pr(t, a, d); const e = back(p); el.style.opacity = cl(p * 3); el.style.transform = `translateY(${(1 - eo(p)) * dist}px) rotate(${rot}deg) scale(${lerp(from, 1, e)})`; }
function slam(el, t, a, d = 0.32, from = 1.22) { const p = pr(t, a, d); el.style.opacity = cl(p * 4); return lerp(from, 1, eo(p)); }

/* ---------- 정적 DOM 생성 (seek 밖에서는 한 번만 만든다. 상태는 남기지 않는다) ---------- */
const TILES = [['한 줄 기록', '하루 30초', 5.3], ['주간 돌아보기', '일요일 저녁', 5.5], ['조용한 알림', '정한 시각에 한 번', 5.7]];
(() => { let s = ''; TILES.forEach((t, i) => { s += `<div class="tile" id="tile${i}" style="left:${140 + i * 420}px;top:330px"><div class="cat b">${t[0]}</div><div class="det">${t[1]}</div><div class="td"></div></div>`; }); $('tiles').innerHTML = s; })();

/* ---------- seek ---------- */
window.seek = function (t) {
  t = Math.max(0, Math.min(DUR, t));
  const tv = Math.min(t, 13); // 마지막 1초는 화면을 멈춘다

  $('grid').style.transform = `translate(${(tv * 3.2) % 120}px,${(tv * 1.6) % 120}px)`;

  // 장면 1 (0~2.4초)
  const sc1 = $('sc1'); sc1.style.display = t < 2.4 ? '' : 'none';
  if (t < 2.4) {
    rise($('s1label'), t, 0.2, 0.6, 20);
    rise($('s1title'), t, 0.35, 0.8, 50);
    const p = back(pr(t, 1.0, 0.45));
    $('s1dot').style.transform = `translate(1460px,500px) scale(${p})`;
    sc1.style.opacity = 1 - pr(t, 2.0, 0.4);
  }

  // 장면 2 (2.3~5.0초) · 숫자를 세며 올린다
  const sc2 = $('sc2'); sc2.style.display = (t >= 2.3 && t < 5.0) ? '' : 'none';
  if (t >= 2.3 && t < 5.0) {
    const out = pr(t, 4.6, 0.4); sc2.style.opacity = 1 - out; sc2.style.transform = `translateX(${-ei(out) * 80}px)`;
    rise($('s2label'), t, 2.4, 0.5, 24); rise($('s2title'), t, 2.5, 0.6, 36);
    const cp = eio(pr(t, 2.8, 1.4));
    $('s2n').textContent = Math.round(lerp(0, 100, cp));
    $('s2num').style.opacity = eo(pr(t, 2.7, 0.5));
    $('s2track').style.opacity = pr(t, 2.8, 0.3);
    $('s2bar').style.transform = `scaleX(${cp})`;
    rise($('s2fine'), t, 3.6, 0.5, 14);
  }

  // 장면 3 (4.9~8.0초) · 타일이 하나씩 튀어 오른다
  const sc3 = $('sc3'); sc3.style.display = (t >= 4.9 && t < 8.0) ? '' : 'none';
  if (t >= 4.9 && t < 8.0) {
    rise($('s3label'), t, 5.0, 0.5, 24); rise($('s3title'), t, 5.1, 0.6, 36);
    TILES.forEach((tl, i) => pop($('tile' + i), t, tl[2], 0.5, 0.88, 56));
    sc3.style.opacity = 1 - pr(t, 7.6, 0.4);
  }

  // 장면 4 (7.9~10.6초) · 큰 글자
  const dark = $('dark'); dark.style.display = (t >= 7.9 && t < 10.6) ? '' : 'none';
  if (t >= 7.9 && t < 10.6) {
    $('s4a').style.transform = `scale(${slam($('s4a'), t, 8.1)})`;
    $('s4b').style.transform = `scale(${slam($('s4b'), t, 8.9, 0.36, 1.35)})`;
    dark.style.opacity = 1 - pr(t, 10.2, 0.4);
  }

  // 장면 5 (10.3초~) · 끝 화면
  const sc5 = $('sc5'); sc5.style.display = t >= 10.3 ? '' : 'none';
  if (t >= 10.3) {
    rise($('s5title'), t, 10.4, 0.8, 50);
    rise($('s5sub'), t, 10.9, 0.6, 30);
    rise($('s5pill'), t, 11.4, 0.6, 24);
  }
};
document.fonts.ready.then(() => { window.seek(0); window.__ready = true; });
</script>
</body>
</html>
